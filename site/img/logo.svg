<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="arcGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d1b6e"/>
    </radialGradient>
    <radialGradient id="arcSheen" cx="25%" cy="18%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="figGrad" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
  </defs>

  <!-- ── Crescent arc ── -->
  <!-- Outer R=82, Inner R=53, center (100,100)           -->
  <!-- Gap opens to the right: 60° (lower) to 320° (upper) -->
  <!-- Outer 60°: (141,171)  Outer 320°: (163,47)          -->
  <!-- Inner 60°: (127,146)  Inner 320°: (141,66)          -->
  <path fill="url(#arcGrad)" d="
    M 141 171
    A 82 82 0 1 1 163 47
    C 172 36 176 27 168 23
    C 160 19 148 44 141 66
    A 53 53 0 1 0 127 146
    C 119 160 120 175 130 180
    C 140 185 144 178 141 171
    Z"/>

  <!-- 3-D sheen on arc -->
  <path fill="url(#arcSheen)" d="
    M 100 18 A 82 82 0 0 1 163 47
    C 152 28 128 15 100 18 Z"/>

  <!-- ── Human figure ── -->
  <!-- Head -->
  <circle cx="97" cy="78" r="9.5" fill="url(#figGrad)"/>

  <!-- Left arm sweeping up-left -->
  <path fill="url(#figGrad)" d="
    M 97 91 C 86 88 70 78 61 67
    C 64 60 74 61 82 67
    C 90 74 95 83 97 91 Z"/>

  <!-- Right arm sweeping up-right -->
  <path fill="url(#figGrad)" d="
    M 103 91 C 114 88 130 78 139 67
    C 136 60 126 61 118 67
    C 110 74 105 83 103 91 Z"/>

  <!-- Left lower body -->
  <path fill="url(#figGrad)" d="
    M 97 97 C 89 108 77 122 77 132
    C 84 137 94 124 97 113
    C 98 105 97 100 97 97 Z"/>

  <!-- Right lower body -->
  <path fill="url(#figGrad)" d="
    M 103 97 C 111 108 123 122 123 132
    C 116 137 106 124 103 113
    C 102 105 103 100 103 97 Z"/>
</svg>
